 preserveAspectRatio="xMidYMid meet">

<style>
  g > path:first-of-type { fill: #1a241f; }
  g > path:nth-of-type(4n + 2) { fill: #ef6b62; }
  g > path:nth-of-type(4n + 3) { fill: #f4d17a; }
  g > path:nth-of-type(4n + 4) { fill: #8fbd76; }
  g > path:nth-of-type(4n + 5) { fill: #86a9d8; }
  .lead-nose { fill: #ef6b62; filter: drop-shadow(0 0 8px #ef6b62); }

  @media (prefers-reduced-motion: no-preference) {
    g > path:nth-of-type(9n + 2),
    g > path:nth-of-type(9n + 5),
    g > path:nth-of-type(9n + 8) {
      animation: star-twinkle 2.6s ease-in-out infinite;
    }
    g > path:nth-of-type(9n + 5) { animation-delay: -0.8s; }
    g > path:nth-of-type(9n + 8) { animation-delay: -1.6s; }
  }

  @keyframes star-twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
</style>

