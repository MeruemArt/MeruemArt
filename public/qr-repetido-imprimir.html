<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repetición de Código QR - Hoja Carta</title>
  <style>
    @page {
      size: letter;
      margin: 5mm 5mm;
    }
    body {
      background: #fff;
    }
    .qr-grid {
      display: grid;
      grid-template-columns: repeat(4, 50mm);
      grid-template-rows: repeat(5, 50mm);
      gap: 3mm;
    }
    .qr-cell {
      background: #fff;
    }
    .qr-cell img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      margin: 2mm;
    }
  </style>
</head>
<body>
  <div class="qr-grid">
